name: Build and Deploy WebGL

on:
  push:
    branches:
      - main # Si tu rama principal se llama 'master', cámbialo a master aquí

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      # 1. Obtenemos el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Guardamos la caché de la librería de Unity para acelerar futuros builds
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-WebGL-

      # 3. Compilamos el proyecto a WebGL autenticando con tus credenciales
      - name: Unity Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: WebGL

      # 4. Publicamos el resultado automáticamente en GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/WebGL/WebGL